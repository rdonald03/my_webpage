<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ryan Donald</title>
  <meta name="description" content="Personal portfolio homepage.">

  <style>
    /* ---------- Colours and basics (change these to restyle the whole page) ---------- */
    :root {
      --bg: #0a0f1c;          /* main background: very dark blue */
      --bg-soft: #131c33;     /* lighter blue used in the background glow */
      --text: #ffffff;
      --muted: #93a0b8;       /* grey-blue for small text */
      --line: rgba(255, 255, 255, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 50% -10%, var(--bg-soft), transparent 70%),
        var(--bg);
    }

    a { color: inherit; text-decoration: none; }

    /* ---------- Top menu ---------- */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.25rem clamp(1.25rem, 5vw, 3rem);
      border-bottom: 1px solid var(--line);
    }

    .nav-logo {
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .nav-links {
      display: flex;
      gap: clamp(1rem, 3vw, 2rem);
      list-style: none;
      font-size: 0.95rem;
    }

    .nav-links a {
      color: var(--muted);
      padding-bottom: 4px;
      border-bottom: 1px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .nav-links a:hover,
    .nav-links a:focus-visible,
    .nav-links a[aria-current="page"] {
      color: var(--text);
      border-bottom-color: var(--text);
    }

    /* ---------- Hero: title, tagline, buttons ---------- */
    .hero {
      flex: 1;
      text-align: center;
      padding: clamp(3rem, 14vh, 9rem) 1.25rem 4rem;
    }

    .title {
      font-size: clamp(3rem, 11vw, 7.5rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    /* Each letter of the title is wrapped in a span by the script below,
       then drops in one after another. */
    .title .letter {
      display: inline-block;
      white-space: pre;
      opacity: 0;
      animation: trickle 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
    }

    @keyframes trickle {
      from { opacity: 0; transform: translateY(-0.5em); filter: blur(6px); }
      to   { opacity: 1; transform: translateY(0);      filter: blur(0); }
    }

    .tagline {
      margin-top: 1.25rem;
      color: var(--muted);
      font-size: clamp(1rem, 2.2vw, 1.25rem);
    }

    .buttons {
      margin-top: 3rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.25rem;
    }

    /* The tagline and buttons fade in after the title has finished */
    .fade-in {
      opacity: 0;
      animation: fade-up 0.7s ease forwards;
      animation-delay: 1.1s;
    }
    .buttons.fade-in { animation-delay: 1.35s; }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ---------- Glow buttons ----------
       Each button sets its own --glow colour in the HTML.
       On hover it fills with that colour and glows outward. */
    .btn {
      --glow: #38bdf8;
      min-width: 11rem;
      padding: 0.95rem 1.75rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition:
        background-color 0.3s ease,
        border-color 0.3s ease,
        color 0.3s ease,
        box-shadow 0.4s ease,
        transform 0.2s ease;
    }

    .btn:hover,
    .btn:focus-visible {
      background: var(--glow);
      border-color: var(--glow);
      color: #0a0f1c;
      box-shadow:
        0 0 16px 2px var(--glow),
        0 0 56px 8px color-mix(in srgb, var(--glow) 40%, transparent);
      transform: translateY(-2px);
      outline: none;
    }

    .btn:active { transform: translateY(0); }

    /* ---------- Footer ---------- */
    .footer {
      padding: 1.5rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--line);
    }

    /* ---------- Small screens ---------- */
    @media (max-width: 520px) {
      .nav { flex-direction: column; }
      .btn { width: 100%; max-width: 20rem; }
    }

    /* ---------- People who prefer no animation see everything instantly ---------- */
    @media (prefers-reduced-motion: reduce) {
      .title .letter,
      .fade-in {
        animation: none;
        opacity: 1;
      }
      .btn { transition: none; }
    }
  </style>
</head>

<body>

  <!-- Top menu: change the names and links whenever you like -->
  <nav class="nav">
    <a class="nav-logo" href="index.html">LI</a>
    <ul class="nav-links">
      <li><a href="index.html" aria-current="page">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Projects</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <main class="hero">
    <!-- Change the title text here; the animation adapts automatically -->
    <h1 class="title" id="title">Ryan Donald</h1>

    <p class="tagline fade-in">Dolor sit amet, consectetur adipiscing elit.</p>

    <!-- Each button has its own glow colour: edit the --glow value to change it -->
    <div class="buttons fade-in">
      <a class="btn" href="#" style="--glow: #38bdf8;">Button One</a>
      <a class="btn" href="#" style="--glow: #a78bfa;">Button Two</a>
      <a class="btn" href="#" style="--glow: #34d399;">Button Three</a>
    </div>
  </main>

  <footer class="footer">
    &copy; <span id="year">2026</span> Lorem Ipsum
  </footer>

  <script>
    // Split the title into letters so each one can "trickle in" in turn.
    const title = document.getElementById("title");
    const text = title.textContent;
    const delayPerLetter = 0.08; // seconds between letters

    title.setAttribute("aria-label", text); // screen readers still read it as one phrase
    title.textContent = "";

    [...text].forEach((character, index) => {
      const span = document.createElement("span");
      span.className = "letter";
      span.textContent = character;
      span.setAttribute("aria-hidden", "true");
      span.style.animationDelay = (index * delayPerLetter) + "s";
      title.appendChild(span);
    });

    // Keep the footer year current.
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

</body>
</html>
